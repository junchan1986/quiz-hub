<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>料金暗記トレーナー｜おそうじ革命 研修用</title>
<style>
:root{
  --bg:#f5f7f5;
  --card:#ffffff;
  --text:#1f2a22;
  --muted:#6b756d;
  --line:#dfe6df;
  --accent:#2f7d4a;
  --accent2:#eaf5ed;
  --bad:#b83232;
  --badbg:#fdecec;
  --good:#1f7a3f;
  --goodbg:#eaf7ef;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:24px;margin:6px 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.045);
}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
select,button,input{
  width:100%;
  font:inherit;
}
select,input{
  border:1px solid #cfd8cf;
  background:#fff;
  border-radius:10px;
  padding:12px;
  outline:none;
}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,125,74,.12)}
.quiz{
  margin-top:12px;
  border-top:1px solid var(--line);
  padding-top:18px;
}
.badge{
  display:inline-block;
  font-size:12px;
  color:var(--accent);
  background:var(--accent2);
  padding:5px 9px;
  border-radius:999px;
  margin-bottom:12px;
}
.question{
  font-size:22px;
  font-weight:750;
  line-height:1.5;
  margin:6px 0 8px;
}
.note{
  min-height:22px;
  color:var(--muted);
  font-size:13px;
  margin-bottom:14px;
}
.answerRow{
  display:grid;
  grid-template-columns:1fr 110px;
  gap:10px;
}
.answerBox{position:relative}
.answerBox input{
  font-size:26px;
  font-weight:700;
  text-align:right;
  padding-right:42px;
}
.yen{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-weight:700;
}
button{
  border:0;
  border-radius:10px;
  padding:12px 14px;
  font-weight:700;
  cursor:pointer;
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef1ee;color:var(--text)}
.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.result{
  margin-top:14px;
  border-radius:12px;
  padding:13px 14px;
  display:none;
  line-height:1.5;
}
.result.good{display:block;background:var(--goodbg);color:var(--good)}
.result.bad{display:block;background:var(--badbg);color:var(--bad)}
.correctPrice{font-size:24px;font-weight:800}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stats{
  margin-top:16px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.stat{
  background:#f7f9f7;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  text-align:center;
}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted)}
.smallControls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.smallControls button{width:auto;font-size:12px;padding:8px 10px}
.footer{
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
  margin-top:14px;
}
@media(max-width:560px){
  .controls{grid-template-columns:1fr}
  .answerRow{grid-template-columns:1fr}
  .question{font-size:20px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>料金暗記トレーナー</h1>
  <div class="sub">おそうじ革命・研修用｜料金表（2026年2月16日以降）をもとに作成</div>

  <div class="card">
    <div class="controls">
      <div>
        <label for="category">出題範囲</label>
        <select id="category">
          <option value="all">全部</option>
          <option value="基本サービス">基本サービス</option>
          <option value="エアコン">エアコン</option>
          <option value="オプション">オプション・コーティング</option>
          <option value="セット">セット・定額</option>
        </select>
      </div>
      <div>
        <label for="mode">出題モード</label>
        <select id="mode">
          <option value="random">ランダム</option>
          <option value="mistakes">間違えた問題だけ</option>
        </select>
      </div>
    </div>

    <div class="quiz">
      <div class="badge" id="badge">基本サービス</div>
      <div class="question" id="question">読み込み中...</div>
      <div class="note" id="note"></div>

      <div class="answerRow">
        <div class="answerBox">
          <input id="answer" inputmode="numeric" autocomplete="off" placeholder="例：10000">
          <span class="yen">円</span>
        </div>
        <button class="primary" id="judge">判定</button>
      </div>

      <div id="result" class="result"></div>

      <div class="actions">
        <button class="secondary" id="showAnswer">答えを見る</button>
        <button class="primary" id="next">次の問題</button>
      </div>

      <div class="stats">
        <div class="stat"><b id="correct">0</b><span>正解</span></div>
        <div class="stat"><b id="attempts">0</b><span>回答</span></div>
        <div class="stat"><b id="accuracy">-</b><span>正答率</span></div>
      </div>

      <div class="smallControls">
        <button class="ghost" id="resetStats">成績をリセット</button>
        <button class="ghost" id="resetMistakes">間違い履歴をリセット</button>
      </div>
    </div>

    <div class="footer">
      入力は「17,930」「¥17,930」「17930」のどれでもOK。<br>
      「1㎡あたり」「1箇所」「セット料金」など条件がある問題は、問題文・補足に表示します。
    </div>
  </div>
</div>

let current = null;
let correct = Number(localStorage.getItem("pricequiz_correct") || 0);
let attempts = Number(localStorage.getItem("pricequiz_attempts") || 0);
let mistakes = JSON.parse(localStorage.getItem("pricequiz_mistakes") || "[]");
let mistakeSet = new Set(mistakes);
let alreadyJudged = false;
let lastId = null;

const $ = (id)=>document.getElementById(id);
const category = $("category");
const mode = $("mode");
const question = $("question");
const note = $("note");
const badge = $("badge");
const answer = $("answer");
const result = $("result");

function yen(n){ return "¥" + Number(n).toLocaleString("ja-JP"); }
function normalize(v){
  return Number(String(v).replace(/[^\d]/g,""));
}
function pool(){
  const cat = category.value;
  let p = questions.filter(x => cat === "all" || x.cat === cat);
  if(mode.value === "mistakes"){
    p = p.filter(x => mistakeSet.has(x.id));
  }
  return p;
}
function updateStats(){
  $("correct").textContent = correct;
  $("attempts").textContent = attempts;
  $("accuracy").textContent = attempts ? Math.round(correct/attempts*100) + "%" : "-";
  localStorage.setItem("pricequiz_correct", correct);
  localStorage.setItem("pricequiz_attempts", attempts);
  localStorage.setItem("pricequiz_mistakes", JSON.stringify([...mistakeSet]));
}
function newQuestion(){
  const p = pool();
  result.className = "result";
  result.innerHTML = "";
  answer.value = "";
  alreadyJudged = false;
  if(!p.length){
    current = null;
    badge.textContent = "問題なし";
    question.textContent = mode.value === "mistakes"
      ? "この範囲には、まだ間違えた問題がありません。"
      : "この範囲には問題がありません。";
    note.textContent = "";
    answer.disabled = true;
    $("judge").disabled = true;
    return;
  }
  let candidates = p.filter(x => x.id !== lastId);
  if(!candidates.length) candidates = p;
  current = candidates[Math.floor(Math.random()*candidates.length)];
  lastId = current.id;
  badge.textContent = current.cat;
  question.textContent = current.q + " はいくら？";
  note.textContent = current.n || "";
  answer.disabled = false;
  $("judge").disabled = false;
  setTimeout(()=>answer.focus(), 50);
}
function judge(showOnly=false){
  if(!current) return;
  if(showOnly){
    result.className = "result bad";
    result.innerHTML = `正解は <span class="correctPrice">${yen(current.a)}</span>`;
    return;
  }
  if(alreadyJudged) return;
  const v = normalize(answer.value);
  if(!answer.value.trim() || Number.isNaN(v)){
    result.className = "result bad";
    result.textContent = "金額を入力してください。";
    return;
  }
  alreadyJudged = true;
  attempts++;
  if(v === current.a){
    correct++;
    mistakeSet.delete(current.id);
    result.className = "result good";
    result.innerHTML = `正解！ <span class="correctPrice">${yen(current.a)}</span>`;
  }else{
    mistakeSet.add(current.id);
    result.className = "result bad";
    result.innerHTML = `不正解。正解は <span class="correctPrice">${yen(current.a)}</span>`;
  }
  updateStats();
}
$("judge").addEventListener("click",()=>judge(false));
$("showAnswer").addEventListener("click",()=>judge(true));
$("next").addEventListener("click",newQuestion);
answer.addEventListener("keydown",(e)=>{
  if(e.key==="Enter"){
    if(alreadyJudged) newQuestion();
    else judge(false);
  }
});
category.addEventListener("change",newQuestion);
mode.addEventListener("change",newQuestion);
$("resetStats").addEventListener("click",()=>{
  correct=0; attempts=0; updateStats();
});
$("resetMistakes").addEventListener("click",()=>{
  mistakeSet.clear(); updateStats(); newQuestion();
});

updateStats();
newQuestion();
</script>
</body>
</html>
